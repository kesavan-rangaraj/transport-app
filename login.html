<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ponnar Sankar Pranav Transport - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            font-size: 25px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Ponnar Sankar Pranav Transport
    </h1>

    <h2>
        Login
    </h2>

    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                User ID
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter User ID"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        /* ADMIN */

        if (
            username === "kesavan" &&
            password === "12345678"
        ) {

            localStorage.setItem(
                "loggedUser",
                "kesavan"
            );

            localStorage.setItem(
                "userRole",
                "admin"
            );

            message.textContent =
                "Admin login successful.";

            message.className =
                "success";

            setTimeout(function() {

                window.location.href =
                    "ranjith1.html";

            }, 500);

            return;
        }


        /* USER 2 */

        if (
            username === "user2" &&
            password === "User@123"
        ) {

            localStorage.setItem(
                "loggedUser",
                "user2"
            );

            localStorage.setItem(
                "userRole",
                "user"
            );

            message.textContent =
                "User login successful.";

            message.className =
                "success";

            setTimeout(function() {

                window.location.href =
                    "user.html";

            }, 500);

            return;
        }


        /* USER 3 */

        if (
            username === "user3" &&
            password === "User@123"
        ) {

            localStorage.setItem(
                "loggedUser",
                "user3"
            );

            localStorage.setItem(
                "userRole",
                "user"
            );

            message.textContent =
                "User login successful.";

            message.className =
                "success";

            setTimeout(function() {

                window.location.href =
                    "user.html";

            }, 500);

            return;
        }


        /* INVALID */

        message.textContent =
            "Invalid User ID or Password.";

        message.className =
            "error";

    });

</script>

</body>

</html>
